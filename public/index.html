<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Las Delicias de Salomé</title>
  
  <!-- SheetJS para exportar ventas a Excel (.xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --primary: #ea580c;
      --accent: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* PANTALLA INICIAL OBLIGATORIA: REGISTRO / INGRESO CLIENTE */
    #pantalla-registro {
      position: fixed;
      inset: 0;
      background: #090d16;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .caja-registro {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 22px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .label-campo {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--muted);
      text-align: left;
      display: block;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .input-cliente {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      outline: none;
    }
    .input-cliente:focus {
      border-color: var(--primary);
    }

    /* HEADER */
    header {
      background: rgba(30, 41, 59, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      z-index: 50;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cliente-pill {
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
    }
    .btn-admin-directo {
      background: #334155;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
    }

    /* MENÚ */
    .contenedor-menu {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 150px;
      -webkit-overflow-scrolling: touch;
    }
    .buscador {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 14px;
      outline: none;
    }
    .categorias-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
    }
    .cat-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }
    .cat-btn.activa {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* TARJETAS DE PLATOS */
    .lista-platos { display: flex; flex-direction: column; gap: 12px; }
    .plato-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .plato-img-box {
      width: 86px;
      height: 86px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      background: #0f172a;
    }
    .plato-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .plato-detalles { flex: 1; min-width: 0; }
    .plato-nombre { font-size: 0.96rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .plato-desc { font-size: 0.74rem; color: var(--muted); margin: 3px 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .plato-precio-fila { display: flex; justify-content: space-between; align-items: center; }
    .plato-precio { font-size: 1.05rem; font-weight: 900; color: var(--accent); }

    .ctrl-qty {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-qty-mini {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-qty-mini:active { transform: scale(0.9); }
    .txt-qty-val { font-weight: 900; min-width: 16px; text-align: center; }

    .btn-pedir-directo {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-pedir-directo:active { transform: scale(0.92); }

    /* BARRA INFERIOR DE COMPRA PARA EL CLIENTE */
    #barra-compra-cliente {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(30, 41, 59, 0.98);
      border-top: 1px solid var(--border);
      padding: 12px 18px 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(14px);
      z-index: 100;
      box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
    }
    .fila-total-compra {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .txt-cant-items { font-size: 0.82rem; color: var(--muted); font-weight: 700; }
    .txt-gran-total { font-size: 1.3rem; font-weight: 900; color: var(--accent); }

    .btn-whatsapp-comprar {
      width: 100%;
      padding: 14px;
      background: #25d366;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(37, 211, 102, 0.35);
    }
    .btn-whatsapp-comprar:active { transform: scale(0.98); }

    /* MODAL DE ADMINISTRACIÓN TOTALMENTE OCULTO */
    #modal-admin {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .caja-admin {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: left;
    }

    #toast-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      padding: 10px 22px;
      border-radius: 30px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      display: none;
      z-index: 2000;
    }
  </style>
</head>
<body>

  <div id="toast-msg"></div>

  <!-- PANTALLA INICIAL OBLIGATORIA: INGRESO O REGISTRO DE CLIENTE -->
  <div id="pantalla-registro">
    <div class="caja-registro">
      <div style="font-size:2.8rem; margin-bottom:4px;">🥘</div>
      <h2 style="font-weight:900; font-size:1.35rem;">Las Delicias de Salomé</h2>
      <p style="color:var(--muted); font-size:0.85rem; margin:4px 0 18px;">Ingresa tus datos para ordenar</p>

      <label class="label-campo">Tu Celular (WhatsApp):</label>
      <input type="tel" id="reg-telefono" class="input-cliente" placeholder="Ej: 3001234567" inputmode="numeric" oninput="autocompletarSiExiste()">

      <label class="label-campo">Tu Nombre Completo:</label>
      <input type="text" id="reg-nombre" class="input-cliente" placeholder="Nombre y Apellido">

      <label class="label-campo">Mesa donde estás ubicado:</label>
      <select id="reg-mesa" class="input-cliente" style="font-weight:700;">
        <option value="1">Mesa 1</option><option value="2">Mesa 2</option><option value="3">Mesa 3</option><option value="4">Mesa 4</option>
        <option value="5">Mesa 5</option><option value="6">Mesa 6</option><option value="7">Mesa 7</option><option value="8">Mesa 8</option>
      </select>

      <button onclick="ingresarCliente()" style="width:100%; padding:14px; background:var(--primary); color:#fff; border:none; border-radius:12px; font-weight:900; font-size:1rem; cursor:pointer;">
        Ver Menú de Desayunos
      </button>
    </div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="brand-title">
      <span>🥘 Las Delicias</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="cliente-pill" id="header-mesa">Mesa 1</span>
      <span style="font-size:0.8rem; font-weight:700; color:var(--muted);" id="header-nombre">Cliente</span>
      <button class="btn-admin-directo" onclick="pedirClaveAdmin()">📊 Ventas</button>
      <button onclick="cerrarSesionCliente()" style="background:none; border:none; color:var(--muted); font-size:1.1rem; cursor:pointer;" title="Salir">🚪</button>
    </div>
  </header>

  <!-- MENÚ LIMPIO -->
  <main class="contenedor-menu">
    <input type="text" id="caja-buscar" class="buscador" placeholder="🔍 Buscar plato o bebida..." oninput="dibujarMenu()">

    <div class="categorias-scroll">
      <button class="cat-btn activa" onclick="filtrarCat('todos')">🔥 Todos</button>
      <button class="cat-btn" onclick="filtrarCat('desayunos')">🍳 Desayunos</button>
      <button class="cat-btn" onclick="filtrarCat('bebidas')">☕ Bebidas</button>
    </div>

    <div class="lista-platos" id="lista-platos-contenedor"></div>
  </main>

  <!-- BARRA DE COMPRA INFERIOR DEL CLIENTE -->
  <div id="barra-compra-cliente">
    <div class="fila-total-compra">
      <div>
        <div id="txt-resumen-cant" class="txt-cant-items">0 platos seleccionados</div>
        <div style="font-size:0.72rem; color:var(--muted);">Total a pagar</div>
      </div>
      <div id="txt-gran-total" class="txt-gran-total">$0</div>
    </div>
    
    <button class="btn-whatsapp-comprar" onclick="realizarCompraYEnviarFactura()">
      <span>📲</span> Pedir y Recibir Factura al WhatsApp
    </button>
  </div>

  <!-- MODAL DE ACCESO ADMIN (TOTALMENTE ENMASCARADO) -->
  <div id="modal-admin">
    <div class="caja-admin">
      
      <!-- INGRESO CON ENMASCARAMIENTO ESTRICTO -->
      <div id="sec-clave-admin">
        <h3 style="font-weight:900; margin-bottom:6px;">Acceso Administrador</h3>
        <p style="font-size:0.8rem; color:var(--muted); margin-bottom:14px;">Ingresa el código de acceso:</p>
        
        <!-- Campo password estándar de seguridad sin texto de contraseñas -->
        <input type="password" id="input-admin-pin" class="input-cliente" placeholder="••••" maxlength="8" autocomplete="off" inputmode="numeric" style="text-align:center; font-size:1.8rem; letter-spacing:8px;">
        
        <button onclick="validarPinAdmin()" style="width:100%; padding:13px; background:var(--primary); color:#fff; border:none; border-radius:12px; font-weight:800; cursor:pointer;">
          Ingresar
        </button>
        <button onclick="cerrarModalAdmin()" style="width:100%; background:none; border:none; color:var(--muted); font-size:0.85rem; font-weight:700; margin-top:10px; cursor:pointer; text-align:center;">
          Cancelar
        </button>
      </div>

      <!-- PANEL DE CONTROL DE VENTAS -->
      <div id="sec-panel-admin" style="display:none;">
        <h3 style="font-weight:900; margin-bottom:12px;">📊 Control de Caja del Día</h3>
        
        <div style="background:#0f172a; padding:14px; border-radius:12px; margin-bottom:14px;">
          <small style="color:var(--muted); font-weight:700;">TOTAL VENTAS HOY:</small>
          <div id="kpi-admin-total" style="font-size:1.6rem; font-weight:900; color:var(--accent); margin-top:2px;">$0</div>
          <small id="kpi-admin-cuentas" style="color:var(--muted);">0 compras registradas</small>
        </div>

        <button onclick="descargarExcelVentas()" style="width:100%; padding:12px; background:#15803d; color:#fff; border:none; border-radius:10px; font-weight:800; margin-bottom:8px; cursor:pointer;">
          📊 Descargar Arqueo en Excel (.xlsx)
        </button>
        
        <button onclick="enviarResumenAdminWhatsApp()" style="width:100%; padding:12px; background:#25d366; color:#fff; border:none; border-radius:10px; font-weight:800; margin-bottom:8px; cursor:pointer;">
          📲 Enviar Balance del Día a WhatsApp
        </button>
        
        <button onclick="reiniciarCaja()" style="width:100%; padding:12px; background:#ef4444; color:#fff; border:none; border-radius:10px; font-weight:800; margin-bottom:12px; cursor:pointer;">
          🗑️ Reiniciar Caja a $0
        </button>
        
        <button onclick="cerrarModalAdmin()" style="width:100%; background:none; border:none; color:var(--muted); font-size:0.85rem; font-weight:700; cursor:pointer; text-align:center;">
          ← Volver al Menú
        </button>
      </div>

    </div>
  </div>

  <script>
    // Variables de verificación interna en memoria
    const KEY_ADM = "9999";
    const KEY_MES = "1234";

    let categoriaActiva = 'todos';
    let mesaActiva = 1;
    let pedidoActual = [];

    let listaClientes = JSON.parse(localStorage.getItem("salome_db_clientes") || "[]");
    let clienteActual = JSON.parse(localStorage.getItem("salome_cliente_sesion") || "null");

    const fmt = (v) => '$' + Number(v || 0).toLocaleString('es-CO');

    function aviso(txt) {
      const t = document.getElementById('toast-msg');
      t.innerText = txt;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 1500);
    }

    const PLATOS = [
      { id: 1, name: "Arroz con Huevo Frito", price: 9000, cat: "desayunos", desc: "Arroz blanco caliente acompañado de huevo frito con yema tierna", img: "imagenes/arroz_huevo.jpg" },
      { id: 2, name: "Desayuno Salomé Completo", price: 15000, cat: "desayunos", desc: "Huevos revueltos, salchicha, arepa, pandebono, queso y chocolate", img: "imagenes/huevos_completos.jpg" },
      { id: 3, name: "Huevos con Jamón en Cazuela", price: 12000, cat: "desayunos", desc: "Huevos revueltos tiernos con jamón en sartén caliente y jugo", img: "imagenes/huevos_cazuela.jpg" },
      { id: 4, name: "Huevos Rancheros en Tabla", price: 13000, cat: "desayunos", desc: "Huevos revueltos con salchicha en sartén, pan tostado y arepa", img: "imagenes/huevos_madera.jpg" },
      { id: 5, name: "Tamal Tradicional con Chocolate", price: 16000, cat: "desayunos", desc: "Tamal en hoja de plátano con panes campesinos y chocolate", img: "imagenes/tamal.jpg" },
      { id: 6, name: "Caldo de Costilla Casero", price: 14000, cat: "desayunos", desc: "Costilla de res suave en caldo criollo con papa y cilantro picado", img: "imagenes/caldo_costilla.jpg" },
      { id: 7, name: "Calentado Paisa Especial", price: 16000, cat: "desayunos", desc: "Fríjoles refritos con arroz, huevo montado y pan campesino", img: "imagenes/calentado_paisa.jpg" },
      { id: 8, name: "Moñona Salomé Especial", price: 22000, cat: "desayunos", desc: "Arroz, carne en hogao, pechuga/chuleta, huevos fritos y patacón", img: "imagenes/monona.jpg" },
      { id: 9, name: "Plato de Frutas Frescas", price: 8000, cat: "desayunos", desc: "Selección fresca de sandía, melón, papaya, piña dulce y fresa", img: "imagenes/frutas.jpg" },
      { id: 10, name: "Chocolate Especial con Queso", price: 7000, cat: "bebidas", desc: "Taza de chocolate santafereño con queso, pan y almojábana", img: "imagenes/chocolate.jpg" },
      { id: 11, name: "Café Tinto Campesino", price: 3500, cat: "bebidas", desc: "Taza de café recién filtrado, aroma intenso y sabor tradicional", img: "imagenes/cafe.jpg" }
    ];

    function autocompletarSiExiste() {
      const tel = document.getElementById('reg-telefono').value.trim();
      const cli = listaClientes.find(c => c.telefono === tel);
      if (cli) {
        document.getElementById('reg-nombre').value = cli.nombre;
      }
    }

    function ingresarCliente() {
      const tel = document.getElementById('reg-telefono').value.trim();
      const nom = document.getElementById('reg-nombre').value.trim();
      const mesa = Number(document.getElementById('reg-mesa').value);

      if (!tel || tel.length < 7) {
        return alert('Por favor ingresa tu número de WhatsApp.');
      }
      if (!nom) {
        return alert('Por favor ingresa tu nombre.');
      }

      let existente = listaClientes.find(c => c.telefono === tel);
      if (!existente) {
        existente = { telefono: tel, nombre: nom };
        listaClientes.push(existente);
      } else {
        existente.nombre = nom;
      }
      localStorage.setItem("salome_db_clientes", JSON.stringify(listaClientes));

      clienteActual = existente;
      localStorage.setItem("salome_cliente_sesion", JSON.stringify(clienteActual));
      mesaActiva = mesa;

      document.getElementById('header-mesa').innerText = `Mesa ${mesaActiva}`;
      document.getElementById('header-nombre').innerText = clienteActual.nombre;
      document.getElementById('pantalla-registro').style.display = 'none';

      dibujarMenu();
      aviso(`¡Bienvenido, ${clienteActual.nombre}!`);
    }

    function cerrarSesionCliente() {
      pedidoActual = [];
      document.getElementById('barra-compra-cliente').style.display = 'none';
      document.getElementById('pantalla-registro').style.display = 'flex';
    }

    function filtrarCat(c) {
      categoriaActiva = c;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('activa'));
      event.target.classList.add('activa');
      dibujarMenu();
    }

    function dibujarMenu() {
      const cont = document.getElementById('lista-platos-contenedor');
      cont.innerHTML = '';

      const q = (document.getElementById('caja-buscar')?.value || '').toLowerCase().trim();

      let lista = categoriaActiva === 'todos' 
        ? PLATOS 
        : PLATOS.filter(p => p.cat === categoriaActiva);

      if (q) {
        lista = lista.filter(p => p.name.toLowerCase().includes(q));
      }

      lista.forEach(p => {
        const itemEnPedido = pedidoActual.find(x => x.id === p.id);
        const qty = itemEnPedido ? itemEnPedido.qty : 0;

        const card = document.createElement('div');
        card.className = 'plato-card';
        card.innerHTML = `
          <div class="plato-img-box">
            <img src="./${p.img}" alt="${p.name}" loading="lazy" 
                 onerror="if(!this.dataset.t){this.dataset.t=1; this.src='${p.img}';}else{this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-size:1.8rem;\\'>🍳</div>';}">
          </div>
          <div class="plato-detalles">
            <div class="plato-nombre">${p.name}</div>
            <div class="plato-desc">${p.desc}</div>
            <div class="plato-precio-fila">
              <span class="plato-precio">${fmt(p.price)}</span>
              ${qty === 0 ? `
                <button class="btn-pedir-directo" onclick="modificarCantidadPlato(${p.id}, 1)">+ Agregar</button>
              ` : `
                <div class="ctrl-qty">
                  <button class="btn-qty-mini" onclick="modificarCantidadPlato(${p.id}, -1)">-</button>
                  <span class="txt-qty-val">${qty}</span>
                  <button class="btn-qty-mini" onclick="modificarCantidadPlato(${p.id}, 1)">+</button>
                </div>
              `}
            </div>
          </div>
        `;
        cont.appendChild(card);
      });

      actualizarBarraCompraCliente();
    }

    function modificarCantidadPlato(id, delta) {
      const prod = PLATOS.find(p => p.id === id);
      if (!prod) return;

      let item = pedidoActual.find(x => x.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
          pedidoActual = pedidoActual.filter(x => x.id !== id);
        }
      } else if (delta > 0) {
        pedidoActual.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1 });
      }

      dibujarMenu();
    }

    function actualizarBarraCompraCliente() {
      const barra = document.getElementById('barra-compra-cliente');
      if (pedidoActual.length === 0) {
        barra.style.display = 'none';
        return;
      }

      const totalItems = pedidoActual.reduce((a, b) => a + b.qty, 0);
      const totalDinero = pedidoActual.reduce((a, b) => a + (b.price * b.qty), 0);

      document.getElementById('txt-resumen-cant').innerText = `${totalItems} ${totalItems === 1 ? 'plato seleccionado' : 'platos seleccionados'}`;
      document.getElementById('txt-gran-total').innerText = fmt(totalDinero);
      barra.style.display = 'flex';
    }

    function realizarCompraYEnviarFactura() {
      if (pedidoActual.length === 0) return alert('Selecciona al menos un plato.');

      const ahora = new Date();
      const fechaHoy = ahora.toLocaleDateString();
      const horaActual = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const totalPagar = pedidoActual.reduce((a, b) => a + (b.price * b.qty), 0);

      let ventas = JSON.parse(localStorage.getItem("salome_ventas") || "[]");
      const nuevoConsecutivo = ventas.length + 1;
      const numFactura = `FAC-00${nuevoConsecutivo}`;

      ventas.push({
        id: nuevoConsecutivo,
        factura: numFactura,
        mesa: mesaActiva,
        cliente: clienteActual.nombre,
        telefono: clienteActual.telefono,
        items: pedidoActual.map(i => `${i.qty}x ${i.name} (${fmt(i.price)})`).join(', '),
        total: totalPagar,
        fecha: fechaHoy,
        hora: horaActual
      });
      localStorage.setItem("salome_ventas", JSON.stringify(ventas));

      let facturaTexto = `*🧾 FACTURA DE VENTA - LAS DELICIAS DE SALOMÉ*\n`;
      facturaTexto += `NIT: 901.458.723-1\n`;
      facturaTexto += `Nº Factura: ${numFactura}\n`;
      facturaTexto += `Fecha: ${fechaHoy} (${horaActual})\n`;
      facturaTexto += `Mesa: ${mesaActiva}\n`;
      facturaTexto += `Cliente: ${clienteActual.nombre}\n`;
      facturaTexto += `------------------------------------\n`;
      facturaTexto += `*DETALLE DE TU PEDIDO:*\n`;

      pedidoActual.forEach(item => {
        const subtotalPlato = item.price * item.qty;
        facturaTexto += `• ${item.qty}x ${item.name}\n`;
        facturaTexto += `   Valor: ${fmt(item.price)} | Subtotal: ${fmt(subtotalPlato)}\n`;
      });

      facturaTexto += `------------------------------------\n`;
      facturaTexto += `*TOTAL A PAGAR: ${fmt(totalPagar)}*\n`;
      facturaTexto += `------------------------------------\n`;
      facturaTexto += `¡Tu pedido ya está en preparación! Muchas gracias por tu compra. 🥘✨`;

      pedidoActual = [];
      actualizarBarraCompraCliente();
      dibujarMenu();

      let telDestino = clienteActual.telefono.replace(/[^0-9]/g, '');
      if (telDestino.length === 10) telDestino = '57' + telDestino;

      const urlWhatsApp = `https://api.whatsapp.com/send?phone=${encodeURIComponent(telDestino)}&text=${encodeURIComponent(facturaTexto)}`;
      window.open(urlWhatsApp, '_blank');
    }

    /* ACCESO ADMIN PROTEGIDO */
    function pedirClaveAdmin() {
      document.getElementById('sec-clave-admin').style.display = 'block';
      document.getElementById('sec-panel-admin').style.display = 'none';
      document.getElementById('input-admin-pin').value = '';
      document.getElementById('modal-admin').style.display = 'flex';
    }

    function validarPinAdmin() {
      const pin = document.getElementById('input-admin-pin').value.trim();
      
      if (pin === KEY_ADM || pin === KEY_MES) {
        document.getElementById('sec-clave-admin').style.display = 'none';
        document.getElementById('sec-panel-admin').style.display = 'block';
        
        let ventas = JSON.parse(localStorage.getItem("salome_ventas") || "[]");
        const total = ventas.reduce((a, b) => a + Number(b.total), 0);
        document.getElementById('kpi-admin-total').innerText = fmt(total);
        document.getElementById('kpi-admin-cuentas').innerText = `${ventas.length} compras registradas hoy`;
      } else {
        alert('Código incorrecto.');
        document.getElementById('input-admin-pin').value = '';
      }
    }

    function cerrarModalAdmin() {
      document.getElementById('modal-admin').style.display = 'none';
      document.getElementById('input-admin-pin').value = '';
    }

    function descargarExcelVentas() {
      let ventas = JSON.parse(localStorage.getItem("salome_ventas") || "[]");
      if (ventas.length === 0) return alert('No hay ventas registradas.');

      const datos = ventas.map(v => ({
        "Nº Factura": v.factura,
        "Fecha": v.fecha,
        "Hora": v.hora,
        "Mesa": `Mesa ${v.mesa}`,
        "Cliente": v.cliente,
        "Teléfono": v.telefono,
        "Platos y Precios": v.items,
        "Total Pagado ($)": Number(v.total)
      }));

      const total = ventas.reduce((a, b) => a + Number(b.total), 0);
      datos.push({
        "Nº Factura": "TOTAL",
        "Fecha": "",
        "Hora": "",
        "Mesa": "",
        "Cliente": "",
        "Teléfono": "",
        "Platos y Precios": "ARQUEO TOTAL DEL DÍA",
        "Total Pagado ($)": total
      });

      const ws = XLSX.utils.json_to_sheet(datos);
      ws['!cols'] = [{ wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 10 }, { wch: 20 }, { wch: 14 }, { wch: 45 }, { wch: 16 }];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Ventas_Diarias");
      XLSX.writeFile(wb, `Ventas_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    function enviarResumenAdminWhatsApp() {
      let ventas = JSON.parse(localStorage.getItem("salome_ventas") || "[]");
      if (ventas.length === 0) return alert('No hay ventas registradas.');

      const tel = prompt('Ingresa el WhatsApp de destino:');
      if (!tel) return;

      const total = ventas.reduce((a, b) => a + Number(b.total), 0);
      let t = `*🥘 BALANCE DEL DÍA - LAS DELICIAS DE SALOMÉ*\n`;
      t += `Fecha: ${new Date().toLocaleDateString()}\n`;
      t += `Ventas: ${ventas.length} pedidos | Total: ${fmt(total)}\n`;

      window.open(`https://api.whatsapp.com/send?phone=${encodeURIComponent(tel)}&text=${encodeURIComponent(t)}`, '_blank');
    }

    function reiniciarCaja() {
      if (confirm('¿Reiniciar la caja a $0?')) {
        localStorage.removeItem("salome_ventas");
        document.getElementById('kpi-admin-total').innerText = '$0';
        document.getElementById('kpi-admin-cuentas').innerText = '0 compras registradas';
        aviso('Caja reiniciada a $0');
      }
    }

    if (clienteActual && clienteActual.telefono) {
      document.getElementById('header-mesa').innerText = `Mesa ${mesaActiva}`;
      document.getElementById('header-nombre').innerText = clienteActual.nombre;
      document.getElementById('pantalla-registro').style.display = 'none';
      dibujarMenu();
    }
  </script>
</body>
