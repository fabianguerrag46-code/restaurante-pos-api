<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Las Delicias de Salomé</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --b:#334155; --p:#ea580c; --g:#10b981; --t:#f8fafc; --m:#94a3b8; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,sans-serif; -webkit-tap-highlight-color:transparent; user-select:none; }
    body { background:var(--bg); color:var(--t); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
    header, nav { background:rgba(15,23,42,0.95); border-color:var(--b); border-style:solid; z-index:90; }
    header { padding:12px 16px; border-bottom-width:1px; display:flex; justify-content:space-between; align-items:center; }
    nav { position:fixed; bottom:0; left:0; right:0; height:60px; border-top-width:1px; display:flex; }
    .nav-b { flex:1; border:none; background:none; color:var(--m); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:0.75rem; font-weight:700; }
    .nav-b.act { color:var(--p); }
    .screen { flex:1; overflow-y:auto; padding:16px; padding-bottom:80px; display:none; }
    .screen.act { display:block; }
    .inp { width:100%; padding:12px; border-radius:12px; border:1px solid var(--b); background:var(--card); color:#fff; font-size:0.95rem; margin-bottom:12px; outline:none; }
    .btn { width:100%; padding:13px; border-radius:12px; border:none; font-size:0.95rem; font-weight:800; color:#fff; cursor:pointer; margin-top:8px; display:flex; align-items:center; justify-content:center; gap:8px; }
    .card { background:var(--card); border:1px solid var(--b); border-radius:14px; padding:12px; margin-bottom:10px; }
    .food { display:flex; gap:12px; align-items:center; }
    .food img { width:78px; height:78px; border-radius:10px; object-fit:cover; background:#000; }
    .p-btn { background:var(--p); color:#fff; border:none; padding:6px 12px; border-radius:8px; font-weight:800; font-size:0.8rem; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .m-box { background:var(--card); border:1.5px solid var(--b); border-radius:12px; padding:14px; cursor:pointer; }
    .m-box.sel { border-color:var(--p); }
    .modal { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; display:none; align-items:center; justify-content:center; padding:16px; }
    .ticket { background:#fff; color:#111; width:100%; max-width:320px; border-radius:10px; padding:20px; font-family:"Courier New",monospace; font-size:0.85rem; }
    #toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--g); color:#fff; font-weight:800; padding:8px 18px; border-radius:20px; z-index:300; display:none; }
    @media print { body * { visibility:hidden; } #mod-fac, #mod-fac * { visibility:visible; } #mod-fac { position:absolute; inset:0; background:#fff; } .no-p { display:none!important; } }
  </style>
</head>
<body>

  <div id="toast"></div>

  <!-- PANTALLA LOGIN -->
  <div id="mod-auth" class="modal" style="display:flex;">
    <div style="background:var(--card); border:1px solid var(--b); border-radius:16px; padding:22px; width:100%; max-width:320px; text-align:center;">
      <h3 style="font-weight:900;">🥘 Las Delicias</h3>
      <div style="display:flex; gap:6px; background:#090d16; padding:4px; border-radius:10px; margin:14px 0;">
        <button class="nav-b act" id="b-rol-cli" onclick="setRol('cliente')">Cliente</button>
        <button class="nav-b" id="b-rol-mes" onclick="setRol('mesero')">Mesero</button>
        <button class="nav-b" id="b-rol-adm" onclick="setRol('admin')">Admin</button>
      </div>
      <div id="sec-cli">
        <select id="sel-m" class="inp" style="font-weight:700;">
          <option value="1">Mesa 1</option><option value="2">Mesa 2</option><option value="3">Mesa 3</option><option value="4">Mesa 4</option>
          <option value="5">Mesa 5</option><option value="6">Mesa 6</option><option value="7">Mesa 7</option><option value="8">Mesa 8</option>
        </select>
        <button class="btn" style="background:var(--g);" onclick="loginCli()">Entrar</button>
      </div>
      <div id="sec-stf" style="display:none;">
        <input type="password" id="pin-in" class="inp" placeholder="PIN" maxlength="4" style="text-align:center; font-size:1.4rem; letter-spacing:6px;">
        <button class="btn" style="background:var(--g);" onclick="loginStf()">Ingresar</button>
      </div>
    </div>
  </div>

  <!-- HEADER -->
  <header>
    <strong style="display:flex; align-items:center; gap:6px;">🥘 Salomé POS</strong>
    <span id="top-m" onclick="go('mesas')" style="background:var(--b); padding:4px 10px; border-radius:12px; font-size:0.8rem; font-weight:800; color:var(--p); cursor:pointer;">Mesa 1</span>
  </header>

  <!-- PANTALLA 1: MENÚ -->
  <main class="screen act" id="scr-menu">
    <input type="text" id="srch" class="inp" placeholder="🔍 Buscar plato..." oninput="drawMenu()">
    <div style="display:flex; gap:6px; margin-bottom:12px; overflow-x:auto;">
      <button class="p-btn" onclick="setCat('todos')">Todos</button>
      <button class="p-btn" style="background:var(--card);" onclick="setCat('desayunos')">Desayunos</button>
      <button class="p-btn" style="background:var(--card);" onclick="setCat('bebidas')">Bebidas</button>
    </div>
    <div id="menu-box"></div>
  </main>

  <!-- PANTALLA 2: MESAS -->
  <main class="screen" id="scr-mesas">
    <div class="grid" id="mesas-box"></div>
  </main>

  <!-- PANTALLA 3: COMANDA -->
  <main class="screen" id="scr-comanda">
    <h3 id="com-m-txt" style="margin-bottom:12px;">Mesa 1</h3>
    <div id="com-list"></div>
    <div class="card" style="margin-top:14px;">
      <div style="display:flex; justify-content:space-between; font-size:1.15rem; font-weight:900;">
        <span>TOTAL:</span><span id="com-tot" style="color:var(--g);">$0</span>
      </div>
      <button class="btn" style="background:#2563eb;" onclick="verFac(false)">🧾 Ver Factura</button>
      <button class="btn" style="background:var(--g);" id="b-cobrar" onclick="cobrar()">💵 Cobrar y Facturar</button>
    </div>
  </main>

  <!-- PANTALLA 4: CIERRE (ADMIN) -->
  <main class="screen" id="scr-cierre">
    <div class="card">
      <small style="color:var(--m); font-weight:700;">VENTAS TOTALES HOY</small>
      <div id="kpi-caja" style="font-size:1.8rem; font-weight:900; color:var(--g); margin:4px 0;">$0</div>
      <small id="kpi-cuentas" style="color:var(--m);">0 cobros</small>
    </div>
    <input type="tel" id="ws-in" class="inp" placeholder="WhatsApp (ej: 573001234567)">
    <button class="btn" style="background:#25d366;" onclick="enviarWsCierre()">📲 Cierre a WhatsApp</button>
    <button class="btn" style="background:#15803d;" onclick="exportarExcel()">📊 Descargar Excel (.xlsx)</button>
    <button class="btn" style="background:#dc2626; margin-top:16px;" onclick="resetCaja()">🗑️ Reiniciar a $0</button>
  </main>

  <!-- MODAL FACTURA -->
  <div id="mod-fac" class="modal">
    <div class="ticket">
      <div style="text-align:center; border-bottom:1px dashed #666; padding-bottom:8px; margin-bottom:8px;">
        <strong>LAS DELICIAS DE SALOMÉ</strong><br>
        <small id="fac-sub">Mesa 1 | 2026-09-24</small>
      </div>
      <table style="width:100%; border-collapse:collapse; margin-bottom:8px;" id="fac-tb"></table>
      <div style="border-top:1px dashed #666; padding-top:6px; display:flex; justify-content:space-between; font-weight:900;">
        <span>TOTAL:</span><span id="fac-tot">$0</span>
      </div>
      <div class="no-p" style="margin-top:14px; display:flex; flex-direction:column; gap:6px;">
        <button class="btn" style="background:#111; padding:8px;" onclick="window.print()">🖨️ Imprimir / PDF</button>
        <button class="btn" style="background:#25d366; padding:8px;" onclick="wsFac()">📲 WhatsApp</button>
        <button class="btn" style="background:#e2e8f0; color:#111; padding:8px;" onclick="document.getElementById('mod-fac').style.display='none'">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- NAVEGACIÓN -->
  <nav>
    <button class="nav-b act" id="nb-menu" onclick="go('menu')"><span>📋</span>Carta</button>
    <button class="nav-b" id="nb-mesas" onclick="go('mesas')"><span>🪑</span>Mesas</button>
    <button class="nav-b" id="nb-comanda" onclick="go('comanda')"><span>🧾</span>Comanda</button>
    <button class="nav-b" id="nb-cierre" onclick="go('cierre')"><span>📊</span>Cierre</button>
    <button class="nav-b" onclick="document.getElementById('mod-auth').style.display='flex'"><span>🚪</span>Salir</button>
  </nav>

  <script>
    const ITEMS = [
      { id:1, n:"Arroz con Huevo", p:9000, c:"desayunos", img:"./imagenes/arroz_huevo.jpg" },
      { id:2, n:"Desayuno Salomé", p:15000, c:"desayunos", img:"./imagenes/huevos_completos.jpg" },
      { id:3, n:"Huevos Jamón Cazuela", p:12000, c:"desayunos", img:"./imagenes/huevos_cazuela.jpg" },
      { id:4, n:"Huevos Rancheros", p:13000, c:"desayunos", img:"./imagenes/huevos_madera.jpg" },
      { id:5, n:"Tamal Tradicional", p:16000, c:"desayunos", img:"./imagenes/tamal.jpg" },
      { id:6, n:"Caldo de Costilla", p:14000, c:"desayunos", img:"./imagenes/caldo_costilla.jpg" },
      { id:7, n:"Calentado Paisa", p:16000, c:"desayunos", img:"./imagenes/calentado_paisa.jpg" },
      { id:8, n:"Moñona Especial", p:22000, c:"desayunos", img:"./imagenes/monona.jpg" },
      { id:9, n:"Plato de Frutas", p:8000, c:"desayunos", img:"./imagenes/frutas.jpg" },
      { id:10, n:"Chocolate con Queso", p:7000, c:"bebidas", img:"./imagenes/chocolate.jpg" },
      { id:11, n:"Café Tinto", p:3500, c:"bebidas", img:"./imagenes/cafe.jpg" }
    ];

    let rol = 'cliente', mAct = 1, curCat = 'todos', facData = null;
    let mesas = JSON.parse(localStorage.getItem("s_m") || "null") || Array.from({length:8}, (_,i)=>({id:i+1, items:[]}));
    const fmt = v => '$' + Number(v||0).toLocaleString('es-CO');

    function toast(m) {
      const t = document.getElementById('toast');
      t.innerText = m; t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 1400);
    }

    function setRol(r) {
      rol = r;
      ['cli','mes','adm'].forEach(x => document.getElementById(`b-rol-${x}`).classList.remove('act'));
      document.getElementById(`b-rol-${r.slice(0,3)}`).classList.add('act');
      document.getElementById('sec-cli').style.display = r === 'cliente' ? 'block' : 'none';
      document.getElementById('sec-stf').style.display = r !== 'cliente' ? 'block' : 'none';
    }

    function loginCli() {
      mAct = Number(document.getElementById('sel-m').value);
      initUser();
      go('menu');
    }

    function loginStf() {
      const p = document.getElementById('pin-in').value;
      if (rol === 'mesero' && (p === '1234' || p === '9999') || rol === 'admin' && p === '9999') {
        initUser();
        go('mesas');
      } else alert('PIN incorrecto');
    }

    function initUser() {
      document.getElementById('top-m').innerText = `Mesa ${mAct}`;
      document.getElementById('nb-cierre').style.display = rol === 'admin' ? 'flex' : 'none';
      document.getElementById('b-cobrar').innerText = rol === 'cliente' ? 'Enviar Pedido' : '💵 Cobrar y Facturar';
      document.getElementById('mod-auth').style.display = 'none';
      document.getElementById('ws-in').value = localStorage.getItem("s_ws") || "";
    }

    function go(s) {
      document.querySelectorAll('.screen').forEach(x => x.classList.remove('act'));
      document.querySelectorAll('.nav-b').forEach(x => x.classList.remove('act'));
      document.getElementById(`scr-${s}`).classList.add('act');
      if (document.getElementById(`nb-${s}`)) document.getElementById(`nb-${s}`).classList.add('act');
      if (s === 'menu') drawMenu();
      if (s === 'mesas') drawMesas();
      if (s === 'comanda') drawComanda();
      if (s === 'cierre') drawCierre();
    }

    function setCat(c) { curCat = c; drawMenu(); }

    function drawMenu() {
      const q = (document.getElementById('srch')?.value || '').toLowerCase();
      let f = curCat === 'todos' ? ITEMS : ITEMS.filter(x => x.c === curCat);
      if (q) f = f.filter(x => x.n.toLowerCase().includes(q));
      
      document.getElementById('menu-box').innerHTML = f.map(p => `
        <div class="card food">
          <img src="${p.img}" loading="lazy">
          <div style="flex:1;">
            <div style="font-weight:800;">${p.n}</div>
            <div style="color:var(--g); font-weight:900; margin-top:4px;">${fmt(p.p)}</div>
          </div>
          <button class="p-btn" onclick="add(${p.id})">+ Pedir</button>
        </div>
      `).join('');
    }

    function add(id) {
      const p = ITEMS.find(x => x.id === id);
      let m = mesas.find(x => x.id === mAct);
      let it = m.items.find(x => x.n === p.n);
      it ? it.q++ : m.items.push({ n:p.n, p:p.p, q:1 });
      localStorage.setItem("s_m", JSON.stringify(mesas));
      toast(`+1 ${p.n}`);
    }

    function drawMesas() {
      document.getElementById('mesas-box').innerHTML = mesas.map(m => {
        const tot = m.items.reduce((a,b) => a + b.p * b.q, 0);
        return `
          <div class="m-box ${m.id === mAct ? 'sel' : ''}" onclick="mAct=${m.id}; document.getElementById('top-m').innerText='Mesa ${m.id}'; go(rol==='cliente'?'menu':'comanda')">
            <div style="display:flex; justify-content:space-between; font-weight:800;">
              <span>Mesa ${m.id}</span>
              <span style="color:${m.items.length?'#fb923c':'#34d399'}; font-size:0.75rem;">${m.items.length?'OCUPADA':'LIBRE'}</span>
            </div>
            <div style="font-size:1.1rem; font-weight:900; margin-top:8px;">${m.items.length ? fmt(tot) : '-'}</div>
          </div>
        `;
      }).join('');
    }

    function drawComanda() {
      const m = mesas.find(x => x.id === mAct);
      document.getElementById('com-m-txt').innerText = `Mesa ${mAct}`;
      let tot = 0;
      document.getElementById('com-list').innerHTML = m.items.length ? m.items.map(it => {
        tot += it.p * it.q;
        return `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div><strong>${it.n}</strong><br><small style="color:var(--m);">${fmt(it.p)}</small></div>
            <div style="display:flex; align-items:center; gap:8px;">
              <button class="p-btn" style="background:#0f172a;" onclick="modQty('${it.n}', -1)">-</button>
              <strong>${it.q}</strong>
              <button class="p-btn" style="background:#0f172a;" onclick="modQty('${it.n}', 1)">+</button>
            </div>
          </div>
        `;
      }).join('') : '<div style="text-align:center; color:var(--m); padding:20px;">Sin pedidos aún.</div>';
      document.getElementById('com-tot').innerText = fmt(tot);
    }

    function modQty(n, d) {
      let m = mesas.find(x => x.id === mAct);
      let it = m.items.find(x => x.n === n);
      if (it) {
        it.q += d;
        if (it.q <= 0) m.items = m.items.filter(x => x.n !== n);
        localStorage.setItem("s_m", JSON.stringify(mesas));
        drawComanda();
      }
    }

    function verFac(clear) {
      let m = mesas.find(x => x.id === mAct);
      if (!m.items.length && !clear) return alert('Mesa vacía');
      const tot = m.items.reduce((a,b) => a + b.p * b.q, 0);
      facData = { m:mAct, items:[...m.items], tot:tot, d:new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) };
      
      document.getElementById('fac-sub').innerText = `Mesa ${mAct} | ${new Date().toLocaleDateString()} ${facData.d}`;
      document.getElementById('fac-tb').innerHTML = facData.items.map(x => `
        <tr><td>${x.q}x ${x.n}</td><td style="text-align:right;">${fmt(x.p*x.q)}</td></tr>
      `).join('');
      document.getElementById('fac-tot').innerText = fmt(tot);
      document.getElementById('mod-fac').style.display = 'flex';
    }

    function cobrar() {
      let m = mesas.find(x => x.id === mAct);
      if (!m.items.length) return alert('Mesa vacía');
      if (rol === 'cliente') { alert(`Pedido de Mesa ${mAct} enviado a cocina`); return; }

      const tot = m.items.reduce((a,b) => a + b.p * b.q, 0);
      let v = JSON.parse(localStorage.getItem("s_v") || "[]");
      v.push({ id:v.length+1, m:mAct, it:m.items.map(x=>`${x.q}x ${x.n}`).join(', '), tot:tot, f:new Date().toLocaleDateString(), h:new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
      localStorage.setItem("s_v", JSON.stringify(v));

      verFac(true);
      m.items = [];
      localStorage.setItem("s_m", JSON.stringify(mesas));
      drawComanda();
    }

    function wsFac() {
      if (!facData) return;
      let t = `*🧾 FACTURA - LAS DELICIAS DE SALOMÉ*\nMesa: ${facData.m} (${facData.d})\n------------------------\n`;
      facData.items.forEach(x => t += `${x.q}x ${x.n} - ${fmt(x.p * x.q)}\n`);
      t += `------------------------\n*TOTAL: ${fmt(facData.tot)}*\n¡Buen provecho!`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(t)}`, '_blank');
    }

    function drawCierre() {
      let v = JSON.parse(localStorage.getItem("s_v") || "[]");
      document.getElementById('kpi-caja').innerText = fmt(v.reduce((a,b) => a + b.tot, 0));
      document.getElementById('kpi-cuentas').innerText = `${v.length} cuentas cobradas`;
    }

    function enviarWsCierre() {
      let v = JSON.parse(localStorage.getItem("s_v") || "[]");
      if (!v.length) return alert('No hay ventas registradas');
      const tel = document.getElementById('ws-in').value.trim();
      if (!tel) return alert('Ingresa el número con código de país');
      localStorage.setItem("s_ws", tel);

      let t = `*🥘 CIERRE DE CAJA - LAS DELICIAS*\nFecha: ${new Date().toLocaleDateString()}\nTotal ventas: ${fmt(v.reduce((a,b)=>a+b.tot,0))}\nCuentas: ${v.length}\n`;
      window.open(`https://api.whatsapp.com/send?phone=${encodeURIComponent(tel)}&text=${encodeURIComponent(t)}`, '_blank');
    }

    function exportarExcel() {
      let v = JSON.parse(localStorage.getItem("s_v") || "[]");
      if (!v.length) return alert('No hay ventas registradas');
      const d = v.map(x => ({ "Nº":x.id, "Fecha":x.f, "Hora":x.h, "Mesa":`Mesa ${x.m}`, "Platos":x.it, "Total":x.tot }));
      d.push({ "Nº":"TOTAL", "Fecha":"", "Hora":"", "Mesa":"", "Platos":"", "Total":v.reduce((a,b)=>a+b.tot,0) });
      const ws = XLSX.utils.json_to_sheet(d), wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Ventas");
      XLSX.writeFile(wb, `Ventas_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    function resetCaja() {
      if (confirm('¿Reiniciar arqueo a $0?')) {
        localStorage.removeItem("s_v");
        drawCierre();
        toast('Caja reiniciada');
      }
    }

    drawMenu();
  </script>
</body>
</html>
